[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-seeder"
version = "0.1.0"
description = "Synthetic data seeder for MongoDB/DocumentDB"
requires-python = ">=3.10"
dependencies = [
    "pymongo>=4.0",
]

[project.scripts]
data-seeder = "src.generator:main"
