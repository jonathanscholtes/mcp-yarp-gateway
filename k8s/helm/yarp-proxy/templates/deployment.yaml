apiVersion: v1
kind: ServiceAccount
metadata:
  name: yarp-proxy-sa
  namespace: tools
  annotations:
    azure.workload.identity/client-id: {{ .Values.managedIdentityClientId | quote }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: yarp-proxy-secrets
  namespace: tools
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.managedIdentityClientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    cloudName: ""
    objects: |
      array:
        - |
          objectName: proxy-api-key
          objectType: secret
          objectVersion: ""
    tenantId: {{ .Values.keyVault.tenantId | quote }}
  secretObjects:
  - secretName: yarp-proxy-secrets
    type: Opaque
    data:
    - objectName: proxy-api-key
      key: api-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yarp-proxy
  namespace: tools
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: yarp-proxy
  template:
    metadata:
      labels:
        app: yarp-proxy
        azure.workload.identity/use: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: yarp-proxy-sa
      containers:
      - name: yarp-proxy
        image: {{ .Values.registry }}/{{ .Values.image }}:{{ .Values.tag }}
        ports:
        - name: http
          containerPort: {{ .Values.containerPort }}
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://0.0.0.0:{{ .Values.containerPort }}"
        - name: PROXY__APIKEYHEADER
          value: {{ .Values.proxy.apiKeyHeader | quote }}
        - name: PROXY__APIKEY
          valueFrom:
            secretKeyRef:
              name: yarp-proxy-secrets
              key: api-key
        - name: PROXY__UPSTREAMTIMEOUTMINUTES
          value: {{ .Values.proxy.upstreamTimeoutMinutes | quote }}
        - name: REVERSEPROXY__CLUSTERS__MCP-CLUSTER__DESTINATIONS__D1__ADDRESS
          value: {{ .Values.upstream.d1 | quote }}
        - name: REVERSEPROXY__CLUSTERS__MCP-CLUSTER__DESTINATIONS__D2__ADDRESS
          value: {{ .Values.upstream.d2 | quote }}
        - name: REVERSEPROXY__CLUSTERS__MCP-CLUSTER__DESTINATIONS__D3__ADDRESS
          value: {{ .Values.upstream.d3 | quote }}
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu | quote }}
            memory: {{ .Values.resources.requests.memory | quote }}
          limits:
            cpu: {{ .Values.resources.limits.cpu | quote }}
            memory: {{ .Values.resources.limits.memory | quote }}
        volumeMounts:
        - name: secrets-store
          mountPath: "/mnt/secrets-store"
          readOnly: true
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "yarp-proxy-secrets"
---
apiVersion: v1
kind: Service
metadata:
  name: yarp-proxy
  namespace: tools
spec:
  type: {{ .Values.service.type }}
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app: yarp-proxy
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: http
