registry: myacr.azurecr.io
image: yarp-proxy
tag: 0.1.0
replicas: 2

# Container port (must match ASPNETCORE_URLS in Dockerfile)
containerPort: 8080

# Service
service:
  type: LoadBalancer
  port: 80

# Azure Workload Identity / Key Vault
managedIdentityClientId: ""   # --set managedIdentityClientId=<client-id>
keyVault:
  name: ""                    # --set keyVault.name=<keyvault-name>
  tenantId: ""                # --set keyVault.tenantId=<tenant-id>

# Proxy settings — mirror of appsettings.json Proxy section
# Agent Service injects credentials from an ApiKey connection using the 'api-key' header
proxy:
  apiKeyHeader: "api-key"
  upstreamTimeoutMinutes: "10"
  # apiKey is pulled from Key Vault secret "proxy-api-key"

# YARP upstream — one destination per StatefulSet pod for session affinity to work.
# Each pod has a stable DNS name via the headless service.
# When scaling, add/remove destinations here and redeploy the yarp-proxy chart.
upstream:
  d1: "http://mongodb-mcp-server-0.mongodb-mcp-server.tools.svc.cluster.local:3000/"
  d2: "http://mongodb-mcp-server-1.mongodb-mcp-server.tools.svc.cluster.local:3000/"
  d3: "http://mongodb-mcp-server-2.mongodb-mcp-server.tools.svc.cluster.local:3000/"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"
