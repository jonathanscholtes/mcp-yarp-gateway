apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongodb-mcp-server-sa
  namespace: tools
  annotations:
    azure.workload.identity/client-id: {{ .Values.managedIdentityClientId | quote }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mongodb-mcp-server-secrets
  namespace: tools
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.managedIdentityClientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    cloudName: ""
    objects: |
      array:
        - |
          objectName: mongodb-connection-string
          objectType: secret
          objectVersion: ""
    tenantId: {{ .Values.keyVault.tenantId | quote }}
  secretObjects:
  - secretName: mongodb-mcp-secrets
    type: Opaque
    data:
    - objectName: mongodb-connection-string
      key: connection-string
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-mcp-server
  namespace: tools
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: mongodb-mcp-server
  template:
    metadata:
      labels:
        app: mongodb-mcp-server
        azure.workload.identity/use: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9216"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: mongodb-mcp-server-sa
      containers:
      - name: mongodb-mcp-server
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - "--transport"
        - "http"
        - "--httpHost"
        - {{ .Values.http.host | quote }}
        - "--httpPort"
        - {{ .Values.http.port | quote }}
        {{- if .Values.readOnly }}
        - "--readOnly"
        {{- end }}
        - "--loggers"
        - {{ .Values.loggers | quote }}
        ports:
        - name: http-mcp
          containerPort: {{ .Values.http.port }}
          protocol: TCP
        env:
        - name: MDB_MCP_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: mongodb-mcp-secrets
              key: connection-string
        - name: MDB_MCP_TRANSPORT
          value: "http"
        - name: MDB_MCP_HTTP_HOST
          value: {{ .Values.http.host | quote }}
        - name: MDB_MCP_HTTP_PORT
          value: {{ .Values.http.port | quote }}
        - name: MDB_MCP_READ_ONLY
          value: {{ .Values.readOnly | quote }}
        - name: MDB_MCP_TELEMETRY
          value: {{ .Values.telemetry | quote }}
        - name: MDB_MCP_LOGGERS
          value: {{ .Values.loggers | quote }}
        readinessProbe:
          tcpSocket:
            port: http-mcp
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: http-mcp
          initialDelaySeconds: 20
          periodSeconds: 30
          failureThreshold: 5
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu | quote }}
            memory: {{ .Values.resources.requests.memory | quote }}
          limits:
            cpu: {{ .Values.resources.limits.cpu | quote }}
            memory: {{ .Values.resources.limits.memory | quote }}
        volumeMounts:
        - name: secrets-store
          mountPath: "/mnt/secrets-store"
          readOnly: true
      - name: mongodb-exporter
        image: percona/mongodb_exporter:0.40
        ports:
        - name: metrics
          containerPort: 9216
        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: mongodb-mcp-secrets
              key: connection-string
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "mongodb-mcp-server-secrets"
---
# Internal-only ClusterIP service — only reachable from YARP proxy within the cluster
apiVersion: v1
kind: Service
metadata:
  name: mongodb-mcp-server
  namespace: tools
spec:
  type: ClusterIP
  selector:
    app: mongodb-mcp-server
  ports:
  - name: http-mcp
    port: 3000
    targetPort: http-mcp
